<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Food Diary</title>
    <style>
        :root {
            --bg-color: #f3e9e9; /* Muted pink [cite: 1] */
            --primary-green: #2d5a43; /* Dark forest green [cite: 1] */
            --accent-green: rgba(45, 90, 67, 0.1);
        }

        body {
            background-color: #dcdcdc;
            font-family: 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .diary-card {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--primary-green);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .title-section h1 {
            color: var(--primary-green);
            font-size: 48px;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .title-section h1 span {
            display: block;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 38px;
            text-transform: capitalize;
            letter-spacing: 0;
        }

        .meta-info {
            color: var(--primary-green);
            font-weight: bold;
            text-align: right;
        }

        .meta-field {
            margin-bottom: 10px;
        }

        .meta-field span {
            border-bottom: 1px solid var(--primary-green);
            display: inline-block;
            min-width: 150px;
            margin-left: 5px;
        }

        /* Entry Sections */
        .meal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .meal-box {
            border: 1px solid var(--primary-green);
            border-radius: 5px;
            overflow: hidden;
        }

        .meal-label {
            background-color: var(--primary-green);
            color: white;
            padding: 5px 15px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .meal-content {
            height: 80px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Reflection Section */
        .reflection-section {
            margin-top: 20px;
            color: var(--primary-green);
        }

        .reflection-row {
            margin-bottom: 20px;
        }

        .reflection-label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .rating-stars {
            font-size: 24px;
            color: var(--primary-green);
            letter-spacing: 10px;
        }

        .improvement-box {
            width: 100%;
            height: 100px;
            border: 1.5px solid var(--primary-green);
            background: transparent;
            border-radius: 4px;
        }

        @media print {
            body { background: white; }
            .diary-card { box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="diary-card">
        <header>
            <div class="title-section">
                <h1><span>Daily food</span> diary</h1> </div>
            <div class="meta-info">
                <div class="meta-field">Date: <span></span></div> <div class="meta-field">Day of the week: <span></span></div> </div>
        </header>

        <div class="meal-grid">
            <div class="meal-box">
                <div class="meal-label">Breakfast</div> <div class="meal-content"></div>
            </div>
            <div class="meal-box">
                <div class="meal-label">Snack</div> <div class="meal-content"></div>
            </div>
            <div class="meal-box">
                <div class="meal-label">Lunch</div> <div class="meal-content"></div>
            </div>
            <div class="meal-box">
                <div class="meal-label">Snack</div> <div class="meal-content"></div>
            </div>
            <div class="meal-box">
                <div class="meal-label">Supper</div> <div class="meal-content"></div>
            </div>
            <div class="meal-box">
                <div class="meal-label">Snack</div> <div class="meal-content"></div>
            </div>
        </div>

        <div class="reflection-section">
            <div class="reflection-row">
                <span class="reflection-label">Rate your day:</span> <div class="rating-stars">◯ ◯ ◯ ◯ ◯</div>
            </div>
            <div class="reflection-row">
                <span class="reflection-label">What can I improve on?</span> <div class="improvement-box"></div>
            </div>
        </div>
    </div>

</body>
</html>
